    <!-- Starta klocka och notiskoll direkt -->
    <script>
        function playChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            } catch (e) {
                console.log("Ljud kunde inte spelas upp automatiskt:", e);
            }
        }

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        function triggerNotification(title, body) {
            playChime();
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: body, icon: "" });
            }
        }

        let lastTriggeredMinute = "";

        function updateClockAndDate() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${hours}:${minutes}`;

            const clockEl = document.getElementById('clock');
            if (clockEl) clockEl.textContent = currentTimeStr;

            const daysOfWeek = ["SÖNDAG", "MÅNDAG", "TISDAG", "ONSDAG", "TORSDAG", "FREDAG", "LÖRDAG"];
            const months = ["JANUARI", "FEBRUARI", "MARS", "APRIL", "MAJ", "JUNI", "JULI", "AUGUSTI", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DECEMBER"];
            
            const dayName = daysOfWeek[now.getDay()];
            const dayNum = now.getDate();
            const monthName = months[now.getMonth()];
            
            const dateEl = document.getElementById('date');
            if (dateEl) dateEl.textContent = `${dayName} ${dayNum} ${monthName}`;

            if (currentTimeStr !== lastTriggeredMinute && window.checkActivityReminders) {
                lastTriggeredMinute = currentTimeStr;
                window.checkActivityReminders(currentTimeStr);
            }
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // Tidsväljare logik
        let selectedHour = "08";
        let selectedMinute = "00";

        function initWheels() {
            const hourWheel = document.getElementById('hour-wheel');
            const minuteWheel = document.getElementById('minute-wheel');
            hourWheel.innerHTML = '';
            minuteWheel.innerHTML = '';

            for (let i = 0; i < 24; i++) {
                const hStr = String(i).padStart(2, '0');
                const div = document.createElement('div');
                div.className = `wheel-item ${hStr === selectedHour ? 'selected' : ''}`;
                div.textContent = hStr;
                div.onclick = () => {
                    selectedHour = hStr;
                    initWheels();
                };
                hourWheel.appendChild(div);
            }

            for (let i = 0; i < 60; i += 5) {
                const mStr = String(i).padStart(2, '0');
                const div = document.createElement('div');
                div.className = `wheel-item ${mStr === selectedMinute ? 'selected' : ''}`;
                div.textContent = mStr;
                div.onclick = () => {
                    selectedMinute = mStr;
                    initWheels();
                };
                minuteWheel.appendChild(div);
            }
        }

        window.openTimePicker = function() {
            const currentVal = document.getElementById('new-time').value;
            if (currentVal && currentVal.includes(':')) {
                const parts = currentVal.split(':');
                selectedHour = parts[0];
                selectedMinute = parts[1];
            }
            initWheels();
            document.getElementById('time-picker-modal').style.display = 'flex';
        }

        window.closeTimePicker = function() {
            document.getElementById('time-picker-modal').style.display = 'none';
        }

        window.confirmTimeSelection = function() {
            const timeStr = `${selectedHour}:${selectedMinute}`;
            document.getElementById('new-time').value = timeStr;
            document.getElementById('time-display-text').textContent = timeStr;
            document.getElementById('time-display-text').style.color = '#0f172a';
            closeTimePicker();
        }

        window.clearTimeSelection = function() {
            document.getElementById('new-time').value = '';
            document.getElementById('time-display-text').textContent = 'Välj tid (valfritt)...';
            document.getElementById('time-display-text').style.color = '#64748b';
            closeTimePicker();
        }
    </script>

        const firebaseConfig = {

                const defaultActs = {
                    "morgon": { title: "Morgonmedicin", type: "daily", time: "", notify: true, secret: "1956" },
                    "kvall": { title: "Kvällsmedicin", type: "daily", time: "", notify: true, secret: "1956" }
                };
                set(activitiesRef, defaultActs);
            } else {
                allActivities = data;
                renderApp();
                renderAdminList();
                renderWeekView();
            }
        });

        const completionsRef = ref(db, `completions/${todayKey}`);
        onValue(completionsRef, (snapshot) => {
            todayCompletions = snapshot.val() || {};
            renderApp();
            renderWeekView();
        });

        const allCompletionsRef = ref(db, 'completions');
        onValue(allCompletionsRef, (snapshot) => {
            allCompletionsCache = snapshot.val() || {};
            renderWeekView();
        });

        async function fetchAndCheckLogs() {
            try {
                const res = await fetch(`${medFirebaseURL}/.json`);
                const data = await res.json();
                
                if (!data) return;

                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];

                const logs = Object.keys(data).map(key => ({
                    id: key,
                    timestamp: data[key].timestamp,
                    battery: data[key].battery
                })).filter(log => log.timestamp);

                logs.forEach(log => {
                    const clickDate = new Date(log.timestamp * 1000);
                    const clickDateStr = clickDate.toISOString().split('T')[0];

                    if (clickDateStr === todayStr) {
                        const hours = clickDate.getHours();
                        const minutes = String(clickDate.getMinutes()).padStart(2, '0');
                        const timeStr = `${String(hours).padStart(2, '0')}:${minutes}`;

                        let targetKey = null;
                        Object.entries(allActivities).forEach(([key, act]) => {
                            const titleLower = act.title.toLowerCase();
                            if (titleLower.includes('medicin')) {
                                if (hours < 12 && titleLower.includes('morgon')) {
                                    targetKey = key;
                                } else if (hours >= 12 && titleLower.includes('kväll')) {
                                    targetKey = key;
                                } else if (!targetKey) {
                                    targetKey = key;
                                }
                            }
                        });

                        if (targetKey) {
                            const compRef = ref(db, `completions/${todayKey}/${targetKey}`);
                            set(compRef, { completed: true, time: timeStr, secret: "1956" });
                        }
                    }
                });
            } catch (error) {
                console.error("Fel vid hämtning av medicinloggar:", error);
            }
        }

        fetchAndCheckLogs();
        setInterval(fetchAndCheckLogs, 10000);

        window.checkActivityReminders = function(currentTimeStr) {
            const now = new Date();
            const currentDayOfWeek = now.getDay();
            const todayDateStr = now.toISOString().split('T')[0];

            Object.entries(allActivities).forEach(([id, act]) => {
                if (!act.notify) return;

                let show = false;
                if (act.type === 'daily') show = true;
                else if (act.type === 'once' && act.date === todayDateStr) show = true;
                else if (act.type === 'weekly' && act.days && act.days.includes(String(currentDayOfWeek))) show = true;

                if (show) {
                    let defaultTime = act.title.toLowerCase().includes('kväll') ? '20:00' : '08:00';
                    let targetTime = act.time || defaultTime;

                    if (targetTime === currentTimeStr) {
                        const isCompleted = todayCompletions[id] && todayCompletions[id].completed;
                        if (!isCompleted) {
                            triggerNotification("Dags för aktivitet!", act.title + ` (${targetTime})`);
                        }
                    }
                }
            });
        };

        function renderApp() {
            const container = document.getElementById('activities-container');
            container.innerHTML = '';

            const now = new Date();
            const currentDayOfWeek = now.getDay();
            const todayDateStr = now.toISOString().split('T')[0];

            let todaysList = [];

            Object.entries(allActivities).forEach(([id, act]) => {
                let show = false;
                if (act.type === 'daily') {
                    show = true;
                } else if (act.type === 'once' && act.date === todayDateStr) {
                    show = true;
                } else if (act.type === 'weekly' && act.days && act.days.includes(String(currentDayOfWeek))) {
                    show = true;
                }

                if (show) {
                    let defaultTime = act.title.toLowerCase().includes('kväll') ? '20:00' : '08:00';
                    let sortTime = act.time || defaultTime;
                    todaysList.push({ id, ...act, sortTime, defaultTime });
                }
            });

            todaysList.sort((a, b) => a.sortTime.localeCompare(b.sortTime));

            if (todaysList.length === 0) {
                container.innerHTML = '<div class="no-activities">Inga aktiviteter inlagda idag.</div>';
                return;
            }

            todaysList.forEach(act => {
                const isCompleted = todayCompletions[act.id] && todayCompletions[act.id].completed;
                const isMedication = act.title.toLowerCase().includes('medicin');
                
                let displayTime = act.time;
                if (!displayTime) {
                    displayTime = (isCompleted && todayCompletions[act.id].time) ? todayCompletions[act.id].time : act.defaultTime;
                }

                const card = document.createElement('div');
                card.className = `activity-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="activity-info">
                        <div class="activity-time">${displayTime}</div>
                        <div class="activity-name">${act.title}</div>
                    </div>
                    <div class="activity-status-icon">✓</div>
                    <div class="press-indicator"></div>
                `;

                if (!isMedication) {
                    const indicator = card.querySelector('.press-indicator');
                    
                    const startPress = (e) => {
                        e.preventDefault();
                        indicator.style.width = '100%';
                        indicator.style.transition = 'width 1s linear';

                        pressTimer = setTimeout(() => {
                            toggleCompletion(act.id, !isCompleted);
                            resetPress(indicator);
                        }, 1000);
                    };

                    const cancelPress = () => {
                        if (pressTimer) {
                            clearTimeout(pressTimer);
                            pressTimer = null;
                            resetPress(indicator);
                        }
                    };

                    card.addEventListener('mousedown', startPress);
                    card.addEventListener('touchstart', startPress);
                    card.addEventListener('mouseup', cancelPress);
                    card.addEventListener('mouseleave', cancelPress);
                    card.addEventListener('touchend', cancelPress);
                    card.addEventListener('touchcancel', cancelPress);
                }

                container.appendChild(card);
            });
        }

        function resetPress(indicator) {
            indicator.style.transition = 'none';
            indicator.style.width = '0%';
        }

        function toggleCompletion(id, status) {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const compRef = ref(db, `completions/${todayKey}/${id}`);
            if (status) {
                set(compRef, { completed: true, time: timeStr, secret: "1956" });
            } else {
                set(compRef, { completed: false, time: null, secret: "1956" });
            }
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

        window.changeWeek = function(direction) {
            currentWeekOffset += direction;
            renderWeekView();
        }

        window.goToCurrentWeek = function() {
            currentWeekOffset = 0;
            renderWeekView();
        }

        function renderWeekView() {
            const container = document.getElementById('week-days-container');
            const label = document.getElementById('week-number-label');
            if (!container || !label) return;
            container.innerHTML = '';

            const now = new Date();
            now.setDate(now.getDate() + (currentWeekOffset * 7));

            const weekNum = getWeekNumber(now);
            label.textContent = `Vecka ${weekNum}`;

            const daysOfWeekNames = ["Söndag", "Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag"];
            const monthsNames = ["januari", "februari", "mars", "april", "maj", "juni", "juli", "augusti", "september", "oktober", "november", "december"];
            const todayStr = new Date().toISOString().split('T')[0];

            const currentDay = now.getDay();
            const diffToMonday = now.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
            const monday = new Date(now.setDate(diffToMonday));

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + i);
                
                const dayOfWeekIndex = dayDate.getDay();
                const dayDateStr = dayDate.toISOString().split('T')[0];
                const dayName = daysOfWeekNames[dayOfWeekIndex];
                const formattedDateStr = `${dayDate.getDate()} ${monthsNames[dayDate.getMonth()]}`;
                const isToday = (dayDateStr === todayStr);

                const dayComps = allCompletionsCache[dayDateStr] || {};

                let dayActs = [];
                Object.entries(allActivities).forEach(([id, act]) => {
                    let show = false;
                    if (act.type === 'daily') show = true;
                    else if (act.type === 'once' && act.date === dayDateStr) show = true;
                    else if (act.type === 'weekly' && act.days && act.days.includes(String(dayOfWeekIndex))) show = true;

                    if (show) {
                        let defaultTime = act.title.toLowerCase().includes('kväll') ? '20:00' : '08:00';
                        
                        let displayTime = act.time;
                        let isCompleted = dayComps[id] && dayComps[id].completed;

                        if (!displayTime) {
                            const comp = dayComps[id];
                            if (comp && comp.time) {
                                displayTime = comp.time;
                            } else {
                                displayTime = defaultTime;
                            }
                        }

                        let sortTime = act.time || displayTime;
                        dayActs.push({ ...act, displayTime, sortTime, isCompleted });
                    }
                });

                dayActs.sort((a, b) => a.sortTime.localeCompare(b.sortTime));

                const dayBox = document.createElement('div');
                dayBox.className = `week-day-box ${isToday ? 'is-today' : ''}`;
                
                let actsHtml = dayActs.length > 0 ? dayActs.map(a => `
                    <div class="week-act-item">
                        <div class="week-act-left">
                            <span class="week-act-time">${a.displayTime}</span>
                            <span>${a.title}</span>
                        </div>
                        ${a.isCompleted ? '<span class="week-act-check">✓</span>' : ''}
                    </div>
                `).join('') : '<span style="color:#94a3b8; font-size:0.9rem;">Inga aktiviteter</span>';

                dayBox.innerHTML = `
                    <h4>${dayName} ${formattedDateStr} ${isToday ? '<span class="today-badge">Idag</span>' : ''}</h4>
                    <div>${actsHtml}</div>
                `;
                container.appendChild(dayBox);
            }
        }

        window.toggleRepeatOptions = function() {
            const type = document.getElementById('new-type').value;
            document.getElementById('date-group').style.display = type === 'once' ? 'block' : 'none';
            document.getElementById('days-group').style.display = type === 'weekly' ? 'block' : 'none';
        }

        window.saveActivity = function() {
            const editId = document.getElementById('edit-activity-id').value;
            const title = document.getElementById('new-title').value.trim();
            const time = document.getElementById('new-time').value;
            const notify = document.getElementById('new-notify').checked;
            const type = document.getElementById('new-type').value;
            const date = document.getElementById('new-date').value;
            
            const checkboxes = document.querySelectorAll('.days-selector input[type="checkbox"]:checked');
            const days = Array.from(checkboxes).map(cb => cb.value);

            if (!title) {
                alert('Vänligen fyll i ett aktivitetsnamn.');
                return;
            }

            if (type === 'once' && !date) {
                alert('Vänligen välj ett datum.');
                return;
            }

            if (type === 'weekly' && days.length === 0) {
                alert('Vänligen välj minst en veckodag.');
                return;
            }

            const activityData = { title, time, notify, type, date, days, secret: "1956" };

            if (editId) {
                update(ref(db, `activities/${editId}`), activityData);
                alert('Aktiviteten har uppdaterats!');
            } else {
                const newActRef = push(ref(db, 'activities'));
                set(newActRef, activityData);
                alert('Aktiviteten har lagts till!');
            }

            resetAdminForm();
        }

        window.editActivity = function(id) {
            const act = allActivities[id];
            if (!act) return;

            document.getElementById('edit-activity-id').value = id;
            document.getElementById('new-title').value = act.title;
            
            const timeVal = act.time || '';
            document.getElementById('new-time').value = timeVal;
            const displayText = document.getElementById('time-display-text');
            if (timeVal) {
                displayText.textContent = timeVal;
                displayText.style.color = '#0f172a';
            } else {
                displayText.textContent = 'Välj tid (valfritt)...';
                displayText.style.color = '#64748b';
            }

            document.getElementById('new-notify').checked = !!act.notify;
            document.getElementById('new-type').value = act.type || 'daily';
            document.getElementById('new-date').value = act.date || '';
            
            document.querySelectorAll('.days-selector input[type="checkbox"]').forEach(cb => {
                cb.checked = act.days && act.days.includes(cb.value);
            });

            toggleRepeatOptions();

            document.getElementById('admin-form-title').textContent = 'Redigera aktivitet';
            document.getElementById('save-activity-btn').textContent = 'Spara ändringar';
            document.getElementById('cancel-edit-btn').style.display = 'block';
            
            document.getElementById('admin-modal').scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetAdminForm = function() {
            document.getElementById('edit-activity-id').value = '';
            document.getElementById('new-title').value = '';
            document.getElementById('new-time').value = '';
            
            const displayText = document.getElementById('time-display-text');
            displayText.textContent = 'Välj tid (valfritt)...';
            displayText.style.color = '#64748b';

            document.getElementById('new-notify').checked = false;
            document.getElementById('new-type').value = 'daily';
            document.getElementById('new-date').value = '';
            document.querySelectorAll('.days-selector input[type="checkbox"]').forEach(cb => cb.checked = false);
            toggleRepeatOptions();

            document.getElementById('admin-form-title').textContent = 'Lägg till ny aktivitet';
            document.getElementById('save-activity-btn').textContent = 'Spara aktivitet';
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        function renderAdminList() {
            const listContainer = document.getElementById('admin-activities-list');
            listContainer.innerHTML = '';

            if (Object.keys(allActivities).length === 0) {
                listContainer.innerHTML = '<p style="color:#94a3b8;">Inga sparade aktiviteter.</p>';
                return;
            }

            Object.entries(allActivities).forEach(([id, act]) => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <div onclick="editActivity('${id}')" style="flex:1;">
                        <strong>${act.title}</strong> ${act.notify ? '🔔' : ''}<br>
                        <small style="color:#64748b;">${act.time || 'Ingen tid angiven'} (${act.type})</small>
                    </div>
                    <div class="admin-item-actions">
                        <button class="btn-danger" onclick="event.stopPropagation(); deleteActivity('${id}')">Ta bort</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        window.deleteActivity = function(id) {
            if (confirm('Är du säker på att du vill ta bort denna aktivitet?')) {
                remove(ref(db, `activities/${id}`));
                resetAdminForm();
            }
        }

        document.getElementById('open-week-btn').addEventListener('click', () => {
            currentWeekOffset = 0;
            renderWeekView();
            document.getElementById('week-modal').style.display = 'block';
        });

        document.getElementById('close-week').addEventListener('click', () => {
            document.getElementById('week-modal').style.display = 'none';
        });

        document.getElementById('admin-btn').addEventListener('click', () => {
            const pin = prompt('Ange PIN-kod för admin:');
            if (pin === '1956') {
                resetAdminForm();
                document.getElementById('admin-modal').style.display = 'block';
            } else if (pin !== null) {
                alert('Felaktig PIN-kod.');
            }
        });

        document.getElementById('close-admin').addEventListener('click', () => {
            document.getElementById('admin-modal').style.display = 'none';
        });
    </script>
</body>
</html>
